name: Test Docker Image

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Pull and run image
      run: |
        docker pull yourusername/your-image:latest
        docker run -d -p 3000:3000 --name test-container yourusername/your-image:latest
        sleep 10
        
        # Test if container is running
        docker ps | grep test-container
        
        # Check logs
        docker logs test-container
        
        # Test endpoint (if web app)
        curl -f http://localhost:3000 || echo "Container is running but no web endpoint"
        
        # Cleanup
        docker stop test-container
        docker rm test-container
